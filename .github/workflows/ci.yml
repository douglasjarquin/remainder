name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Set up pinned Go modules
        run: GOTOOLCHAIN=local go mod download all
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check dependencies
        run: GOPROXY=off ./scripts/check-dependencies.sh
      - name: Test
        run: GOPROXY=off go test -race -shuffle=on -count=1 ./...
      - name: Build release-like binary
        run: CGO_ENABLED=0 GOPROXY=off go build -trimpath -ldflags='-s -w -X main.version=v0.1.0' ./cmd/remainder
